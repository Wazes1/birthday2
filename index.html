<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Sana Dönene Kadar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lora:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <header class="hero">
      <h1 class="title">Sana Dönene Kadar</h1>
      <p class="subtitle">14 gün boyunca her gün açılacak küçük notlar hazırladım.</p>
    </header>

    <main class="card-list" id="cardList">
      <!-- Kartlar script.js tarafından oluşturulacak -->
    </main>

    <footer class="footer">
      <img src="images/foto.jpg" alt="Bizim fotoğrafımız" class="footer-photo">
    </footer>
  </div>

  <!-- Popup / Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Kapat">&times;</button>
      <p class="modal-day" id="modalDay">Gün 1</p>
      <p class="modal-text" id="modalText">Not buraya gelecek.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
